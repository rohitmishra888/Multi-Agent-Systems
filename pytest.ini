# pytest.ini
# pytest configuration for Phase 1 API Discovery

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests requiring a live VAmPI instance
    unit: Pure unit tests (no network calls)

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Minimum coverage threshold (optional — uncomment to enforce)
# addopts = --cov=. --cov-report=term-missing --cov-fail-under=80
